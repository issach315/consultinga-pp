[project]
name = "consulting-api"
version = "0.1.0"
description = "Consulting SaaS backend API - Phase 1 authentication"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.2.1",
    "redis>=5.2.1",
    "minio>=7.2.13",
    "aiosmtplib>=3.0.2",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.20",
    "phonenumbers>=9.0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
