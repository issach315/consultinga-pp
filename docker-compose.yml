services:
  redis:
    image: redis:7-alpine
    container_name: consulting-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: consulting-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./consulting-api
      dockerfile: Dockerfile
    container_name: consulting-api
    restart: unless-stopped
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./consulting-api/.env
    environment:
      # MySQL runs on the host, not in Compose — host.docker.internal reaches
      # it from inside the container. See DATABASE_URL in consulting-api/.env.
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bind explicitly to IPv4. Docker Desktop's IPv6 localhost proxy can
      # accept ::1 connections without forwarding a response, which makes
      # *.localhost tenant URLs appear to hang before falling back.
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./consulting-api/app:/app/app
      - ./consulting-api/alembic:/app/alembic
      - ./consulting-api/tests:/app/tests

  ui:
    build:
      context: ./consulting-ui
      dockerfile: Dockerfile
    container_name: consulting-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    volumes:
      # Mount only files Vite needs during development. Mounting the whole
      # project makes polling traverse dependency and build directories.
      - ./consulting-ui/src:/app/src
      - ./consulting-ui/public:/app/public
      - ./consulting-ui/index.html:/app/index.html
      - ./consulting-ui/vite.config.ts:/app/vite.config.ts

volumes:
  redis_data:
  minio_data:
